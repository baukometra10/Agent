services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: evolve
      POSTGRES_PASSWORD: evolve
      POSTGRES_DB: evolve
    ports:
      - "5432:5432"
    volumes:
      - evolve_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolve -d evolve"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://evolve:evolve@db:5432/evolve
      DATABASE_URL_SYNC: postgresql://evolve:evolve@db:5432/evolve
      WORKSPACES_ROOT: /data/workspaces
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - evolve_workspaces:/data/workspaces
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://evolve:evolve@db:5432/evolve
      DATABASE_URL_SYNC: postgresql://evolve:evolve@db:5432/evolve
      WORKSPACES_ROOT: /data/workspaces
    volumes:
      - ./backend:/app
      - evolve_workspaces:/data/workspaces
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  evolve_pg:
  evolve_workspaces:
